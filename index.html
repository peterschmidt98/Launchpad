<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Launchpad — Your Return to the Workforce Starts Here</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#3730A3',
            accent: '#F59E0B',
            surface: '#FAFAF9',
            ink: '#1E293B',
            success: '#10B981',
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
          },
        }
      }
    }
  </script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-surface text-ink font-sans">

  <!-- Sidebar -->
  <aside id="sidebar" class="fixed top-0 left-0 h-full w-[260px] bg-ink text-white flex flex-col z-40">
    <div class="p-6 border-b border-white/10">
      <h1 class="text-xl font-bold tracking-tight">Launchpad 🚀</h1>
    </div>
    <nav id="chapter-list" class="flex-1 overflow-y-auto py-4">
      <!-- Populated by app.js -->
    </nav>
    <div class="p-4 border-t border-white/10">
      <p class="text-xs text-white/50 leading-relaxed">Your return to the workforce starts here</p>
    </div>
  </aside>

  <!-- Mobile hamburger -->
  <button id="menu-toggle" class="fixed top-4 left-4 z-50 md:hidden bg-ink text-white p-2 rounded-lg shadow-lg">
    <svg id="menu-icon-open" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
    </svg>
    <svg id="menu-icon-close" class="w-6 h-6 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
    </svg>
  </button>

  <!-- Sidebar overlay (mobile) -->
  <div id="sidebar-overlay" class="fixed inset-0 bg-black/50 z-30 hidden"></div>

  <!-- Main content -->
  <main id="main-content" class="md:ml-[260px] min-h-screen">
    <div id="chapter-container" class="max-w-3xl mx-auto px-6 py-10">
      <!-- Populated by chapter render functions -->
    </div>
  </main>

  <!-- Scripts (dependency order) -->
  <script src="api.js"></script>
  <script src="chapters/chapter1.js"></script>
  <script src="chapters/chapter2.js"></script>
  <script src="chapters/chapter3.js"></script>
  <script src="chapters/chapter4.js"></script>
  <script src="chapters/chapter5.js"></script>
  <script src="chapters/chapter6.js"></script>
  <script src="app.js"></script>
</body>
</html>
